[pytest]
# ─────────────────────────────────────────────────────────────
# pytest.ini  –  Master configuration for the Humanize test suite
# ─────────────────────────────────────────────────────────────

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers (groups / suites)
markers =
    number:    Tests for humanize.number module (intcomma, intword, ordinal, apnumber, metric, clamp)
    filesize:  Tests for humanize.filesize module (naturalsize)
    duration:  Tests for humanize.duration module (precisedelta)
    time:      Tests for humanize.time module (naturaltime, naturalday, naturaldelta, naturaldate)
    i18n:      Tests for humanize.i18n module (activate, deactivate, decimal_separator)
    lists:     Tests for humanize.lists module (natural_list)
    smoke:     Quick sanity smoke tests
    regression: Regression tests for known edge-cases
    parametrize: Data-driven parametrized test cases
    csv_driven: Tests consuming data from external CSV files

# Default options
addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/test_report.html
    --self-contained-html
    --cov=.
    --cov-report=html:reports/coverage
    --cov-report=term-missing

# Parallel execution (enabled via CLI: pytest -n auto)
# Use: pytest -n auto          → all CPU cores
# Use: pytest -n 4             → 4 workers

# Test ordering plugin settings (pytest-order)
# Tests within a module run in definition order unless overridden with @pytest.mark.order(N)
